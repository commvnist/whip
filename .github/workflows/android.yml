name: Android quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_CMDLINE_TOOLS_VERSION: "16111833"
  ANDROID_PLATFORM: "platforms;android-37.0"
  ANDROID_BUILD_TOOLS: "build-tools;36.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: ${{ env.ANDROID_CMDLINE_TOOLS_VERSION }}
          packages: "platform-tools ${{ env.ANDROID_PLATFORM }} ${{ env.ANDROID_BUILD_TOOLS }}"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./scripts/check --ci
      - uses: actions/upload-artifact@v4
        with:
          name: whip-apks
          path: app/build/outputs/apk/**/*.apk

  device-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 28, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: ${{ env.ANDROID_CMDLINE_TOOLS_VERSION }}
          packages: "platform-tools ${{ env.ANDROID_PLATFORM }} ${{ env.ANDROID_BUILD_TOOLS }}"
      - uses: gradle/actions/setup-gradle@v4
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest

  performance-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: ${{ env.ANDROID_CMDLINE_TOOLS_VERSION }}
          packages: "platform-tools ${{ env.ANDROID_PLATFORM }} ${{ env.ANDROID_BUILD_TOOLS }}"
      - uses: gradle/actions/setup-gradle@v4
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew :benchmark:connectedBenchmarkAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whip-benchmark-reports
          path: |
            benchmark/build/outputs/**
            benchmark/build/reports/**
